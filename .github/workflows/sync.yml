name: Sync O'Colly clips

# Hands-off: runs every morning, pulls any newly-published articles from the O'Colly
# RSS feed into clips.json (+ downloads their photos), commits, and pushes. Vercel's Git
# integration auto-deploys on the push, so new clips appear on the site within minutes.
# You can also trigger it by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — new clips appear within a few hours, hands-off
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pull new clips from O'Colly RSS
        env:
          # Residential relay so O'Colly's CDN doesn't 429 GitHub's datacenter IPs. Add SCRAPER_API_KEY
          # as a repo Actions secret; without it this step runs direct and O'Colly will rate-limit it.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SKIP_LIVECHECK: '1'   # skip the per-clip link-health pass in CI (saves relay credits)
        run: node scripts/sync-clips.mjs
      - name: Commit & push if anything changed
        run: |
          git config user.name "clip-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new clips."
          else
            git commit -m "chore: sync new O'Colly clips [skip ci]"
            git push
          fi
