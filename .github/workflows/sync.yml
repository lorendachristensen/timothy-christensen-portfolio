name: Sync O'Colly clips

# Hands-off: runs every morning, pulls any newly-published articles from the O'Colly
# RSS feed into clips.json (+ downloads their photos), commits, and pushes. Vercel's Git
# integration auto-deploys on the push, so new clips appear on the site within minutes.
# You can also trigger it by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — new clips appear within a few hours, hands-off
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pull new clips from O'Colly RSS
        env:
          # Fetch O'Colly through the site's own free Vercel relay (api/ocolly-proxy): the request then
          # comes from Vercel's IP, which O'Colly serves, instead of GitHub's, which it 429s. No secret —
          # the relay is locked to ocolly.com. The {{url}} placeholder is filled in by sync-clips.mjs.
          OCOLLY_FETCH_PROXY: 'https://www.timothy-christensen.com/api/ocolly-proxy?url={{url}}'
          SKIP_LIVECHECK: '1'   # skip the per-clip link-health pass in CI (keeps runs fast)
        run: node scripts/sync-clips.mjs
      - name: Commit & push if anything changed
        run: |
          git config user.name "clip-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new clips."
          else
            git commit -m "chore: sync new O'Colly clips [skip ci]"
            git push
          fi
