<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Broadcast Orange" subtitle="Primary orange ramp + hover/press" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--white);padding:16px;}
  .row{display:flex;gap:0;}
  .sw{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;}
  .sw span{font-size:10px;line-height:1.3;}
  .light{color:var(--ink-950);} .dark{color:#fff;}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--orange-50)"><span class="light">50</span><span class="light">#FFF3EA</span></div>
    <div class="sw" style="background:var(--orange-100)"><span class="light">100</span><span class="light">#FFE0C7</span></div>
    <div class="sw" style="background:var(--orange-300)"><span class="light">300</span><span class="light">#FFB067</span></div>
    <div class="sw" style="background:var(--orange-500)"><span class="dark">500 · brand</span><span class="dark">#FF6A00</span></div>
    <div class="sw" style="background:var(--orange-600)"><span class="dark">600 · hover</span><span class="dark">#E85D00</span></div>
    <div class="sw" style="background:var(--orange-700)"><span class="dark">700 · press</span><span class="dark">#B84900</span></div>
  </div>
</body></html>
