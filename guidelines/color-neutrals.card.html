<!-- @dsCard group="Colors" viewport="700x170" name="Ink & Neutrals" subtitle="Warm-black broadcast neutral ramp" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--white);padding:16px;}
  .row{display:flex;gap:0;flex-wrap:wrap;}
  .sw{width:12.5%;height:64px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:9px;}
  .dark{color:#fff;} .light{color:var(--ink-950);}
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--ink-950)">950</div>
    <div class="sw dark" style="background:var(--ink-900)">900</div>
    <div class="sw dark" style="background:var(--ink-800)">800</div>
    <div class="sw dark" style="background:var(--ink-700)">700</div>
    <div class="sw dark" style="background:var(--ink-600)">600</div>
    <div class="sw dark" style="background:var(--ink-500)">500</div>
    <div class="sw light" style="background:var(--ink-400)">400</div>
    <div class="sw light" style="background:var(--ink-300)">300</div>
    <div class="sw light" style="background:var(--ink-200)">200</div>
    <div class="sw light" style="background:var(--ink-100)">100</div>
    <div class="sw light" style="background:var(--paper);border:1px solid var(--ink-200)">paper</div>
    <div class="sw light" style="background:var(--white);border:1px solid var(--ink-200)">white</div>
  </div>
</body></html>
