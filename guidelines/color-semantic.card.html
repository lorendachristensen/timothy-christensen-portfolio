<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Roles" subtitle="Surface, text & content-type tokens in use" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);padding:16px;background:var(--bg-page);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-body);}
  .dot{width:22px;height:22px;border:2px solid var(--ink-950);}
  code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
</style></head>
<body>
  <div class="grid">
    <div class="chip"><span class="dot" style="background:var(--brand)"></span>--brand <code>orange-500</code></div>
    <div class="chip"><span class="dot" style="background:var(--bg-inverse)"></span>--bg-inverse <code>ink-950</code></div>
    <div class="chip"><span class="dot" style="background:var(--tag-video)"></span>--tag-video <code>orange</code></div>
    <div class="chip"><span class="dot" style="background:var(--tag-article)"></span>--tag-article <code>ink-950</code></div>
    <div class="chip"><span class="dot" style="background:var(--surface-sunken)"></span>--surface-sunken <code>ink-100</code></div>
    <div class="chip"><span class="dot" style="background:var(--brand-soft)"></span>--brand-soft <code>orange-50</code></div>
  </div>
</body></html>
