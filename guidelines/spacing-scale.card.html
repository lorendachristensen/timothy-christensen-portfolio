<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base ramp, space-1 → space-9" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px 20px;background:var(--white);font-family:var(--font-mono);}
  .row{display:flex;align-items:flex-end;gap:14px;height:90px;}
  .c{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--text-muted);}
  .bar{width:var(--w);background:var(--brand);}
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="bar" style="--w:var(--space-1);height:var(--space-1)"></div>1·4</div>
    <div class="c"><div class="bar" style="--w:var(--space-2);height:var(--space-2)"></div>2·8</div>
    <div class="c"><div class="bar" style="--w:var(--space-3);height:var(--space-3)"></div>3·12</div>
    <div class="c"><div class="bar" style="--w:var(--space-4);height:var(--space-4)"></div>4·16</div>
    <div class="c"><div class="bar" style="--w:var(--space-5);height:var(--space-5)"></div>5·24</div>
    <div class="c"><div class="bar" style="--w:var(--space-6);height:var(--space-6)"></div>6·32</div>
    <div class="c"><div class="bar" style="--w:var(--space-7);height:var(--space-7)"></div>7·48</div>
    <div class="c"><div class="bar" style="--w:var(--space-8);height:var(--space-8)"></div>8·64</div>
  </div>
</body></html>
