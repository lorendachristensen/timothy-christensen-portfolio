<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px 20px;background:var(--white);}

  .xl{font-size:52px;} .l{font-size:34px;} .m{font-size:24px;}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
</style></head>
<body>
  <div class="d xl">Full Time<span style="color:var(--brand)">.</span></div>
  <div class="d l">Fourth Quarter Comeback</div>
  <div class="d m">Press Conference Recap</div>
  <div class="meta">Oswald 700 · uppercase · tracking -0.01em · line-height 0.95</div>
</body></html>
