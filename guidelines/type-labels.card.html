<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 20px;background:var(--white);display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-family:var(--font-mono);}
  .kick{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brand);font-weight:600;}
  .kick.ink{color:var(--ink-950);}
  .ts{font-size:12px;color:var(--text-muted);}
  .num{font-size:12px;color:var(--ink-950);border:2px solid var(--ink-950);padding:2px 8px;}
</style></head>
<body>
  <span class="kick">Men's Basketball</span>
  <span class="kick ink">Feature</span>
  <span class="ts">MAR 14, 2026 · 4 MIN READ</span>
  <span class="num">O'COLLY</span>
</body></html>
