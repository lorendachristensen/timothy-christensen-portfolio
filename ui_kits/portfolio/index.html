<!-- @dsCard group="Portfolio Site" viewport="1200x760" name="Portfolio — Interactive" subtitle="Home · Work · Video · Article · About — click through" -->
<!-- @startingPoint section="Portfolio Site" subtitle="Full student-journalist portfolio site" viewport="1200x900" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timothy Christensen — Portfolio</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;background:var(--bg-page);}
  a{color:var(--brand);} a:hover{color:var(--brand-hover);}

  /* ---- Responsive layout (classNames applied in Nav.jsx / screens.jsx) ---- */
  .tc-grid-cards   { grid-template-columns: repeat(3, 1fr); }   /* Home "More stories" + Work grid */
  .tc-grid-feature { grid-template-columns: 1.2fr 1fr; }        /* Home "Latest story" */
  .tc-grid-2       { grid-template-columns: 1fr 1fr; }          /* About hero + Experience/Skills */

  @media (max-width: 900px) {
    .tc-grid-cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 760px) {
    .tc-grid-feature, .tc-grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .tc-grid-cards { grid-template-columns: 1fr; }
    /* keep the sticky nav on one line on phones */
    .tc-nav-mark { font-size: 18px !important; }
    .tc-nav      { gap: 16px !important; }
    .tc-nav a    { font-size: 12px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
function App() {
  const [page, setPage] = React.useState('Home');
  const nav = (p) => { setPage(p); window.scrollTo({ top: 0 }); };
  return (
    <div>
      <window.Nav current={page} onNav={nav} />
      {page === 'Home' && <window.Home onNav={nav} />}
      {page === 'Work' && <window.Work />}
      {page === 'Video' && <window.VideoPage />}
      {page === 'Article' && <window.Article onNav={nav} />}
      {page === 'About' && <window.About />}
      <window.Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
